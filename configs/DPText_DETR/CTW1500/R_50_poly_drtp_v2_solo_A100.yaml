# ---------------------------------------------------------------------------- #
# Experiment #1: DRTP_v2 single-module ablation
# ---------------------------------------------------------------------------- #
# Purpose: Verify that DRTP_v2 (CLIP Dense Adapter) alone contributes
#          positively over the pure visual baseline.
# Hypothesis: DRTP_v2 brings CLIP semantic knowledge → P↑
# ---------------------------------------------------------------------------- #
# Parent: R_50_poly_clip_dense_A100.yaml (TACT + DRTP_v2)
# Change: USE_TACT: False → isolate DRTP_v2 effect
# ---------------------------------------------------------------------------- #
_BASE_: "../Base.yaml"

SEED: 42

DATASETS:
  TRAIN: ("ctw1500_poly_train_rotate_pos",)
  TEST: ("ctw1500_poly_test",)

MODEL:
  WEIGHTS: "pretrain.pth"
  GA_STEPS: 1
  TRANSFORMER:
    USE_CLIP_LANG_PRIOR: False
    USE_TACT: False     # ← disabled for single-module ablation

    # ── DRTP_v2: CLIP Dense Fusion ──
    USE_CLIP: True
    CLIP_DENSE_FUSION: True
    CLIP_PROMPT_GATE: False
    CLIP_QUERY_FUSION: False
    CLIP_BACKBONE: "ViT-B-16"
    CLIP_PRETRAINED: "pretrain/clip-vit-base-patch16"
    CLIP_FREEZE: True
    CLIP_GATE_INIT: 0.0
    CLIP_DROPOUT: 0.0
    CLIP_ALPHA_INIT: 0.5
    CLIP_KEEP_ASPECT: True

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 2e-5
  LR_BACKBONE: 2e-6
  WARMUP_ITERS: 0
  STEPS: (100000,)
  MAX_ITER: 13000
  CHECKPOINT_PERIOD: 1000

INPUT:
  MIN_SIZE_TEST: 1000
  MAX_SIZE_TEST: 1280

TEST:
  EVAL_PERIOD: 1000

DATALOADER:
  NUM_WORKERS: 4

OUTPUT_DIR: "output/r_50_poly/ctw1500/drtp_v2_solo_A100"
