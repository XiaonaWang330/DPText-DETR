# ---------------------------------------------------------------------------- #
# [E3] P3-DRTP + TACT + CURA
# ---------------------------------------------------------------------------- #
# Purpose: Test whether curvature-adaptive residual gating (CURA) fixes
#   TACT's AP80+ degradation, compared to E1 (P3+TACT with uniform gaussian).
#
# Unique variable vs. E1: TACT_USE_CURA: True (vs. False)
# All other config identical to E1.
#
# CURA replaces uniform gaussian smoothing with Perona-Malik curvature gate:
#   gate = exp(-kappa^2 / (2*sigma^2))
# High-curvature points (corners, sharp bends) → suppressed residual.
# Flat regions → full TACT residual.
#
# Monitoring required:
#   - kappa distribution over training
#   - CURA gate distribution (mean/std per decoder layer)
#   - residual norm at high-κ vs. low-κ points
#
# Baseline references (seed=42):
#   P3:       P=91.38 R=85.57 F1=88.38 AP50=82.19 AP50:95=61.80
#   TACT:     P=91.52 R=85.12 F1=88.20 AP50=81.92 AP50:95=60.84
# ---------------------------------------------------------------------------- #
_BASE_: "../Base.yaml"

SEED: 42

DATASETS:
  TRAIN: ("ctw1500_poly_train_rotate_pos",)
  TEST: ("ctw1500_poly_test",)

MODEL:
  WEIGHTS: "pretrain.pth"
  GA_STEPS: 1
  TRANSFORMER:
    USE_CLIP_LANG_PRIOR: False

    # ── P3-DRTP (CLIP → P3 only) ──
    USE_CLIP: True
    CLIP_DENSE_FUSION: True
    CLIP_PROMPT_GATE: False
    CLIP_QUERY_FUSION: False
    CLIP_BACKBONE: "ViT-B-16"
    CLIP_PRETRAINED: "pretrain/clip-vit-base-patch16"
    CLIP_FREEZE: True
    CLIP_GATE_INIT: 0.0
    CLIP_DROPOUT: 0.0
    CLIP_ALPHA_INIT: 0.5
    CLIP_KEEP_ASPECT: True
    CLIP_ACTIVE_LEVELS: [0]        # P3 only

    # ── TACT + CURA ──
    USE_TACT: True
    TACT_USE_CURA: True           # ← THE ONLY DIFFERENCE vs. E1 (P3+TACT)

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 2e-5
  LR_BACKBONE: 2e-6
  WARMUP_ITERS: 0
  STEPS: (100000,)
  MAX_ITER: 13000
  CHECKPOINT_PERIOD: 1000

INPUT:
  MIN_SIZE_TEST: 1000
  MAX_SIZE_TEST: 1280

TEST:
  EVAL_PERIOD: 1000

DATALOADER:
  NUM_WORKERS: 4

OUTPUT_DIR: "output/r_50_poly/ctw1500/drtp_p3_tact_cura_A100"
