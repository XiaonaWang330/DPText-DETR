_BASE_: "../Base.yaml"

SEED: 42

DATASETS:
  TRAIN: ("ctw1500_poly_train_rotate_pos",)
  TEST: ("ctw1500_poly_test",)

MODEL:
  WEIGHTS: "pretrain.pth"  # official pre-trained model
  GA_STEPS: 4  # gradient accumulation, effective batch = IMS_PER_BATCH * GA_STEPS = 8
  TRANSFORMER:
    USE_SOH: True

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 2e-5
  LR_BACKBONE: 2e-6
  WARMUP_ITERS: 0
  STEPS: (100000,) # no step
  MAX_ITER: 13000
  CHECKPOINT_PERIOD: 1000  # save "last" checkpoint every 1000 iters for resume

INPUT:
  MIN_SIZE_TEST: 1000 
  MAX_SIZE_TEST: 1280

TEST:
  EVAL_PERIOD: 1000

OUTPUT_DIR: "output/r_50_poly/ctw1500/V2"
