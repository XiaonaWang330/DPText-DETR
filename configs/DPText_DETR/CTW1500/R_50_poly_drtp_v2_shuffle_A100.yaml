# ---------------------------------------------------------------------------- #
# Experiment #2: DRTP_v2 shuffle ablation
# ---------------------------------------------------------------------------- #
# Purpose: Verify that DRTP_v2 gains come from CLIP semantic knowledge,
#          not just from extra parameters/capacity.
# Hypothesis: Shuffling destroys spatial alignment → P and R fall to baseline.
# If F1 stays above baseline → extra params explain the gain.
# If F1 drops to baseline → CLIP semantics are the true source.
# ---------------------------------------------------------------------------- #
# Parent: R_50_poly_drtp_v2_solo_A100.yaml
# Change: CLIP_SHUFFLE: True → randomly permute patch positions per sample
# ---------------------------------------------------------------------------- #
_BASE_: "../Base.yaml"

SEED: 42

DATASETS:
  TRAIN: ("ctw1500_poly_train_rotate_pos",)
  TEST: ("ctw1500_poly_test",)

MODEL:
  WEIGHTS: "pretrain.pth"
  GA_STEPS: 1
  TRANSFORMER:
    USE_CLIP_LANG_PRIOR: False
    USE_TACT: False

    # ── DRTP_v2: CLIP Dense Fusion (shuffled) ──
    USE_CLIP: True
    CLIP_DENSE_FUSION: True
    CLIP_PROMPT_GATE: False
    CLIP_QUERY_FUSION: False
    CLIP_BACKBONE: "ViT-B-16"
    CLIP_PRETRAINED: "pretrain/clip-vit-base-patch16"
    CLIP_FREEZE: True
    CLIP_GATE_INIT: 0.0
    CLIP_DROPOUT: 0.0
    CLIP_ALPHA_INIT: 0.5
    CLIP_KEEP_ASPECT: True
    CLIP_SHUFFLE: True      # ← destroys spatial-semantic alignment

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 2e-5
  LR_BACKBONE: 2e-6
  WARMUP_ITERS: 0
  STEPS: (100000,)
  MAX_ITER: 13000
  CHECKPOINT_PERIOD: 1000

INPUT:
  MIN_SIZE_TEST: 1000
  MAX_SIZE_TEST: 1280

TEST:
  EVAL_PERIOD: 1000

DATALOADER:
  NUM_WORKERS: 4

OUTPUT_DIR: "output/r_50_poly/ctw1500/drtp_v2_shuffle_A100"
