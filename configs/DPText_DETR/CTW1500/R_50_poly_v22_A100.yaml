_BASE_: "../Base.yaml"

DATASETS:
  TRAIN: ("ctw1500_poly_train_rotate_pos",)
  TEST: ("ctw1500_poly_test",)

MODEL:
  WEIGHTS: "pretrain.pth"
  GA_STEPS: 1
  TRANSFORMER:
    USE_CLIP_LANG_PRIOR: False
    USE_SFA: True
    SFA_AGG_MODE: "point"      # V22: per-point diversity (max kills P)
    CLIP_MODEL_PATH: "pretrain/clip-vit-base-patch16"
    SGIFA:
      ENABLED: True
      USE_UNC_GATE: True
      SKIP_FIRST: True
    LOSS:
      SFA_ALIGN_WEIGHT: 0.1
      SFA_BG_MARGIN: 0.1       # V22: push bg cos_sim < 0.1 (hinge)
      SFA_ALIGN_BG_WEIGHT: 0.1 # V22: bg contrastive weight

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 2e-5
  LR_BACKBONE: 2e-6
  WARMUP_ITERS: 0
  STEPS: (100000,)
  MAX_ITER: 13000
  CHECKPOINT_PERIOD: 1000

INPUT:
  MIN_SIZE_TEST: 1000
  MAX_SIZE_TEST: 1280

TEST:
  EVAL_PERIOD: 1000

OUTPUT_DIR: "output/r_50_poly/ctw1500/V22_A100"
