_BASE_: "R_50_poly_v10.yaml"

# V11: Dual-Path Uncertainty - Decoupled Classification + Regression Uncertainty
#
# Core innovation (CCF-B target):
#   1. NEW cls_log_var head: per-query classification uncertainty
#      - Positive samples: target = log(1 - cls_conf) -> low when classified correctly
#      - Negative samples: target = log(cls_conf)     -> HIGH when false positive (key!)
#   2. FIX V10 regression uncertainty: negative samples now supervised
#      (V10 left 70-90% of queries' log_var untrained -> unreliable at inference)
#   3. Dual-path inference:
#      score = cls_conf * (1-w_reg*sigmoid(reg_unc)) * (1-w_cls*sigmoid(cls_unc))
#
# Training: requires retraining from pretrain.pth (new cls_log_var head + modified losses)
# Inference: both uncertainty paths active by default

MODEL:
  WEIGHTS: "pretrain.pth"
  TRANSFORMER:
    LOSS:
      POINT_COORD_WEIGHT: 5.0    # L1 regression (same as baseline)
      POINT_VAR_WEIGHT: 0.5      # V10: regression uncertainty (positive samples)
      CLS_VAR_WEIGHT: 0.5        # V11: classification uncertainty loss
      REG_VAR_NEG_WEIGHT: 0.3    # V11: negative-sample regression uncertainty
      REG_VAR_NEG_TARGET: 0.0    # V11: target log_var for negatives (0 = high uncertainty)

    # V11 inference: dual-path uncertainty weighting
    INFERENCE_CLS_UNC_WEIGHT: 0.3  # w_cls: classification uncertainty penalty (0=off)
    INFERENCE_REG_UNC_WEIGHT: 0.2  # w_reg: regression uncertainty penalty (0=off)
    INFERENCE_UNC_TEMP: 1.0        # sigmoid temperature (lower = sharper discrimination)
    INFERENCE_AUX_ENSEMBLE: False   # average last-K layer logits for score stability

OUTPUT_DIR: "output/r_50_poly/ctw1500/V11"
